# DEVELOPMENT / LOCAL TESTING ONLY -- NOT a deployment target.
#
# Runs both nodes (api+worker+redis each) plus a fake backend that just
# logs whatever callbacks it receives, all on one machine over a single
# Docker network. The real deployment is node/docker-compose.yml run
# separately on two physically distinct machines with node/.env's
# PARTY0_HOST pointing at the other machine's real address -- this file
# exists only so the async submit -> callback flow (and its failure/
# retry path) can be verified end-to-end without needing two machines or
# a real backend yet.
#
# Build the image first (from repo root): ./node/build.sh
# Then, from this directory:               docker compose up
services:
  node0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # One-shot: generates ONLY party 0's own cert+key, then exits. Split
  # out from the worker's own startup so cert-exchange (below) has a
  # well-defined point to wait on without a startup-order deadlock
  # (worker would otherwise wait for exchange, exchange would wait for
  # worker to generate the cert it's exchanging).
  node0-cert-init:
    image: collateral-node:local
    entrypoint: ["/usr/src/MP-SPDZ/node_scripts/generate_own_cert.sh"]
    environment:
      PARTY_ID: "0"
    volumes:
      - node0-player-data:/usr/src/MP-SPDZ/Player-Data

  node1-cert-init:
    image: collateral-node:local
    entrypoint: ["/usr/src/MP-SPDZ/node_scripts/generate_own_cert.sh"]
    environment:
      PARTY_ID: "1"
    volumes:
      - node1-player-data:/usr/src/MP-SPDZ/Player-Data

  # One-shot, DEV-ONLY: copies each node's public cert into the other's
  # Player-Data and rehashes both. In the real two-machine deployment
  # this exact exchange is a manual, out-of-band step (see
  # node/README.md) -- automated here only because both volumes happen
  # to be reachable from one host in this local-test file.
  cert-exchange:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/cert-exchange.sh"]
    depends_on:
      node0-cert-init:
        condition: service_completed_successfully
      node1-cert-init:
        condition: service_completed_successfully
    volumes:
      - node0-player-data:/node0
      - node1-player-data:/node1
      - ./cert-exchange.sh:/cert-exchange.sh:ro

  node0-api:
    image: collateral-node:local
    command: ["api"]
    depends_on: [node0-redis]
    environment:
      PARTY_ID: "0"
      PARTY0_HOST: "node0-worker"
      PORT_BASE: "5000"
      HTTP_PORT: "8000"
      REDIS_URL: "redis://node0-redis:6379/0"
    ports:
      - "8000:8000"
    volumes:
      - node0-player-data:/usr/src/MP-SPDZ/Player-Data
      - node0-logs:/usr/src/MP-SPDZ/node_logs

  node0-worker:
    image: collateral-node:local
    command: ["worker"]
    depends_on:
      node0-redis:
        condition: service_started
      cert-exchange:
        condition: service_completed_successfully
    environment:
      PARTY_ID: "0"
      PARTY0_HOST: "node0-worker"
      PORT_BASE: "5000"
      REDIS_URL: "redis://node0-redis:6379/0"
    volumes:
      - node0-player-data:/usr/src/MP-SPDZ/Player-Data
      - node0-logs:/usr/src/MP-SPDZ/node_logs

  node1-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  node1-api:
    image: collateral-node:local
    command: ["api"]
    depends_on: [node1-redis]
    environment:
      PARTY_ID: "1"
      PARTY0_HOST: "node0-worker"
      PORT_BASE: "5000"
      HTTP_PORT: "8000"
      REDIS_URL: "redis://node1-redis:6379/0"
    ports:
      - "8001:8000"
    volumes:
      - node1-player-data:/usr/src/MP-SPDZ/Player-Data
      - node1-logs:/usr/src/MP-SPDZ/node_logs

  node1-worker:
    image: collateral-node:local
    command: ["worker"]
    depends_on:
      node1-redis:
        condition: service_started
      cert-exchange:
        condition: service_completed_successfully
    environment:
      PARTY_ID: "1"
      PARTY0_HOST: "node0-worker"
      PORT_BASE: "5000"
      REDIS_URL: "redis://node1-redis:6379/0"
    volumes:
      - node1-player-data:/usr/src/MP-SPDZ/Player-Data
      - node1-logs:/usr/src/MP-SPDZ/node_logs

  fake-backend:
    build: ./fake_backend
    ports:
      - "9000:9000"

volumes:
  node0-player-data:
  node0-logs:
  node1-player-data:
  node1-logs:

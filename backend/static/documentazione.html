<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentazione — collateral.mpc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root {
    --sidebar-bg: #23293a;
    --sidebar-bg-2: #1b202e;
    --sidebar-ink: #C7CDE0;
    --sidebar-ink-dim: #8890AA;
    --sidebar-active-bg: #2E3650;
    --accent: #2E7DD1;
    --accent-ink: #ffffff;
    --paper: #ffffff;
    --paper-2: #f7f8fa;
    --ink: #232733;
    --ink-muted: #565D71;
    --ink-faint: #848DA3;
    --border: #E1E5EC;
    --border-strong: #CCD2DE;
    --note-border: #2E7DD1;
    --note-bg: #EBF3FC;
    --warn-border: #C9822A;
    --warn-bg: #FCF2E3;
    --code-bg: #F1F2F5;
    --code-ink: #43314F;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .mono, code { font-family: var(--mono); }
  code {
    background: var(--code-bg); color: var(--code-ink); padding: 0.12em 0.42em;
    border-radius: 4px; font-size: 0.87em;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------------- sidebar ---------------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
    background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2));
    color: var(--sidebar-ink); overflow-y: auto; z-index: 10;
    display: flex; flex-direction: column;
  }
  .sidebar-head { padding: 22px 22px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-head .brand { font-weight: 700; font-size: 15.5px; color: #fff; letter-spacing: -0.01em; }
  .sidebar-head .doctype {
    font-family: var(--mono); font-size: 11px; color: var(--sidebar-ink-dim); margin-top: 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .sidebar-nav { padding: 14px 0 20px; flex: 1; }
  .sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
  .sidebar-nav .chapter > a {
    display: block; padding: 8px 22px; font-size: 14px; font-weight: 600;
    color: var(--sidebar-ink); text-decoration: none; border-left: 3px solid transparent;
  }
  .sidebar-nav .chapter > a .num { color: var(--sidebar-ink-dim); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
  .sidebar-nav .chapter > a:hover, .sidebar-nav .sub a:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .sidebar-nav .chapter > a.active { background: var(--sidebar-active-bg); border-left-color: var(--accent); color: #fff; }
  .sidebar-nav ul.sub-list { list-style: none; margin: 0; padding: 0 0 6px; }
  .sidebar-nav .sub a {
    display: block; padding: 6px 22px 6px 40px; font-size: 13px; color: var(--sidebar-ink-dim);
    text-decoration: none; border-left: 3px solid transparent;
  }
  .sidebar-nav .sub a .num { font-family: var(--mono); font-size: 11px; margin-right: 6px; }
  .sidebar-nav .sub a.active { color: #fff; border-left-color: var(--accent); }

  /* always on screen -- fixed to the viewport, not the sidebar, so it
     survives sidebar scroll, the mobile off-canvas collapse, and the
     mobile drawer being open or closed. */
  .demo-fab {
    position: fixed; top: 14px; right: 14px; z-index: 25;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    font-family: var(--sans); font-weight: 700; font-size: 13px;
    padding: 9px 16px; border-radius: 20px; box-shadow: 0 2px 10px rgba(46,125,209,0.35);
  }
  .demo-fab:hover { background: #2568b3; }

  /* ---------------- content ---------------- */
  .content-wrap { margin-left: var(--sidebar-w); min-height: 100vh; }
  .content { max-width: 1180px; margin: 0 auto; padding: 48px 56px 120px; }

  .doc-header { margin-bottom: 44px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
  .doc-header .doctype-label {
    font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-faint); margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(26px, 3.4vw, 33px); font-weight: 800; letter-spacing: -0.015em;
    line-height: 1.25; margin: 0 0 12px; color: #14161f; text-wrap: balance;
  }
  .doc-header .subtitle { font-size: 17px; color: var(--ink-muted); line-height: 1.55; max-width: 68ch; margin: 0; }

  .breadcrumb {
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin: 0 0 6px;
  }
  .breadcrumb .sep { margin: 0 6px; }

  h2 {
    font-size: 25px; font-weight: 800; letter-spacing: -0.012em; color: #14161f;
    margin: 0 0 18px; padding-top: 4px; scroll-margin-top: 24px;
  }
  h2 .chnum { color: var(--accent); margin-right: 10px; font-family: var(--mono); font-weight: 700; }
  h3 {
    font-size: 19px; font-weight: 700; color: #1c1f2a; margin: 36px 0 12px;
    scroll-margin-top: 24px;
  }
  h3 .chnum { color: var(--accent); margin-right: 8px; font-family: var(--mono); font-weight: 600; font-size: 0.85em; }
  h4 {
    font-size: 16px; font-weight: 700; color: #1c1f2a; margin: 26px 0 10px;
    scroll-margin-top: 24px;
  }
  h4 .chnum { color: var(--accent); margin-right: 6px; font-family: var(--mono); font-weight: 600; font-size: 0.85em; }

  section.chapter { margin-bottom: 64px; }
  section.chapter:last-of-type { margin-bottom: 24px; }
  .doc-body p {
    margin: 0 0 16px; font-size: 16px; line-height: 1.75; color: var(--ink); max-width: 100%;
    text-align: justify; text-justify: inter-word; hyphens: auto;
  }
  .doc-body p:last-child { margin-bottom: 0; }
  hr.chapter-rule { border: none; border-top: 1px solid var(--border); margin: 48px 0 0; }

  /* cross-reference links ("Capitolo N" -> target chapter's title) */
  a.chref { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  a.chref:hover { border-bottom-style: solid; }

  /* ---------------- lists ---------------- */
  ul.doc-list, ol.doc-list {
    margin: 0 0 22px; padding-left: 1.5em; max-width: 100%;
  }
  .doc-list li {
    font-size: 16px; line-height: 1.75; color: var(--ink); margin-bottom: 14px;
  }
  .doc-list li:last-child { margin-bottom: 0; }
  .doc-list li::marker { color: var(--accent); font-weight: 700; }

  /* ---------------- admonitions ---------------- */
  .admonition {
    border-left: 4px solid var(--note-border); background: var(--note-bg);
    border-radius: 0 8px 8px 0; padding: 14px 18px; margin: 18px 0 22px; max-width: 100%;
  }
  .admonition.attenzione { border-left-color: var(--warn-border); background: var(--warn-bg); }
  .admonition .adm-label {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 700; color: var(--note-border); margin-bottom: 6px;
  }
  .admonition.attenzione .adm-label { color: var(--warn-border); }
  .admonition p { font-size: 14.5px; line-height: 1.65; margin: 0; color: #333844; text-align: justify; text-justify: inter-word; }

  /* ---------------- code blocks ---------------- */
  .code-block {
    margin: 18px 0 24px; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--paper);
  }
  .code-block-title {
    font-size: 13px; font-weight: 700; color: var(--ink-muted); padding: 10px 16px;
    background: var(--paper-2); border-bottom: 1px solid var(--border);
  }
  .code-block-pre { margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--code-bg); }
  .code-block-code {
    font-family: var(--mono); font-size: 13px; line-height: 1.65; color: var(--code-ink);
    white-space: pre;
  }

  /* ---------------- bibliography ---------------- */
  .bibliography {
    margin: 22px 0 26px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .bib-label {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 700; color: var(--ink-faint); margin-bottom: 10px;
  }
  .bib-list { margin: 0; padding-left: 1.6em; font-size: 13.5px; line-height: 1.65; color: var(--ink-muted); }
  .bib-list li { margin-bottom: 8px; }
  .bib-list li:last-child { margin-bottom: 0; }
  .bib-autore { color: var(--ink); font-weight: 600; }
  .bib-titolo { color: var(--accent); text-decoration: none; }
  .bib-titolo:hover { text-decoration: underline; }
  .bib-dettagli { font-style: italic; }
  .bib-anno { color: var(--ink-faint); }

  /* ---------------- tables ---------------- */
  .table-wrap { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--border); border-radius: 10px; }
  .doc-table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 480px; }
  .doc-table caption {
    text-align: left; font-size: 13px; font-weight: 700; color: var(--ink-muted);
    padding: 10px 14px; background: var(--paper-2); border-bottom: 1px solid var(--border); caption-side: top;
  }
  .doc-table th, .doc-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: left; }
  .doc-table thead th {
    background: var(--paper-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-muted); font-weight: 700; border-bottom: 2px solid var(--border-strong);
  }
  .doc-table tbody tr:last-child td { border-bottom: none; }
  .doc-table tbody tr:hover td { background: var(--paper-2); }
  .doc-table td, .doc-table th { font-variant-numeric: tabular-nums; }

  /* ---------------- charts ---------------- */
  .chart-card {
    border: 1px solid var(--border); border-radius: 12px; background: var(--paper);
    padding: 20px 22px 16px; margin: 20px 0 26px; max-width: 780px;
  }
  .chart-card .chart-title { font-size: 14.5px; font-weight: 700; color: #1c1f2a; margin-bottom: 14px; }
  .chart-card canvas { max-height: 340px; }
  .chart-card .chart-caption { font-size: 13px; color: var(--ink-muted); margin: 14px 0 0; line-height: 1.55; max-width: 70ch; }
  .chart-card .chart-source { font-size: 12px; color: var(--ink-faint); font-style: italic; margin: 6px 0 0; }

  footer.doc-foot {
    max-width: 100%; margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--ink-faint);
  }

  #load-error { display: none; color: #B23A32; font-family: var(--mono); font-size: 14px; padding: 20px 0; }

  /* mobile: collapse sidebar into a top bar with a toggle */
  .sidebar-toggle { display: none; }
  @media (max-width: 900px) {
    .sidebar {
      transform: translateX(-100%); transition: transform 0.2s ease; width: 82vw; max-width: 320px;
    }
    .sidebar.open { transform: translateX(0); box-shadow: 8px 0 30px rgba(0,0,0,0.35); }
    .content-wrap { margin-left: 0; }
    .content { padding: 24px 22px 90px; }
    .sidebar-toggle {
      display: inline-flex; align-items: center; gap: 8px; position: fixed; top: 14px; left: 14px; z-index: 20;
      background: var(--sidebar-bg); color: #fff; border: none; border-radius: 8px; padding: 9px 12px;
      font-family: var(--mono); font-size: 12.5px; cursor: pointer;
    }
    .content { padding-top: 64px; }
  }
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar">&#9776; indice</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="brand">collateral.mpc</div>
    <div class="doctype" id="sidebar-doctype"></div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav" aria-label="Indice dei capitoli"></nav>
</aside>

<a href="/demo" class="demo-fab">Vai alla demo &rarr;</a>

<div class="content-wrap">
  <div class="content">
    <header class="doc-header">
      <div class="doctype-label" id="doc-doctype-label"></div>
      <h1 id="doc-title">&nbsp;</h1>
      <p class="subtitle" id="doc-subtitle"></p>
    </header>

    <div id="doc-body" class="doc-body"></div>

    <div id="load-error">Impossibile caricare il contenuto della documentazione (<code>/content/documentazione.json</code>). Riprova pi&ugrave; tardi.</div>

    <footer class="doc-foot">
      <p style="margin:0;">Documento generato da un unico file JSON versionato insieme al resto del progetto &mdash; ogni capitolo o sottosezione aggiunta l&igrave; compare qui automaticamente.</p>
    </footer>
  </div>
</div>

<script>
(function() {
  'use strict';

  const CHART_COLORS = ['#2E7DD1', '#E8A33D', '#5FB98C', '#8B6FD6', '#D1637F'];

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Conservative inline "code" detection: capitalized file paths
  // (Networking/Server.cpp), function-call-like tokens (getsockname()),
  // filenames with a recognized source extension, and ALL_CAPS_WITH_
  // UNDERSCORE constants. Deliberately narrow -- broad heuristics catch
  // ordinary Italian phrases with a slash ("prestito/valore") as false
  // positives, checked directly against this document's real text
  // before picking the pattern.
  const CODE_PATTERN = new RegExp(
    '\\b[A-Z][\\w-]*(?:/[\\w.-]+)+\\b' +           // Networking/Server.cpp
    '|\\bresults_[\\w-]*(?:/[\\w.-]+)*/?' +         // results_produzione/n5/
    '|\\b[a-zA-Z_]\\w*\\(\\)' +                     // getsockname()
    '|\\b[\\w-]+\\.(?:cpp|py|h|x|json|mpc)\\b' +    // file.ext
    '|\\b[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+\\b',          // POLICY_VERSION
    'g'
  );

  // Cross-references: "Capitolo 4" anywhere in prose becomes a link to
  // that chapter, showing ITS title rather than "Capitolo 4" -- same idea
  // as Sphinx's :ref: with no explicit link text. Built once per render()
  // from data.capitoli, keyed by the "numero" string.
  let CHAPTER_BY_NUMERO = {};
  function buildChapterIndex(capitoli) {
    CHAPTER_BY_NUMERO = {};
    (capitoli || []).forEach(function(cap) {
      CHAPTER_BY_NUMERO[String(cap.numero)] = cap;
    });
  }
  const CAPITOLO_REF_PATTERN = /Capitolo\s+(\d+)/g;

  // Single pass over the text: merges "code span" matches and "chapter
  // cross-reference" matches (by position) so both transformations apply
  // wherever this function is called -- paragraphs, note text, list
  // items, chart captions -- without running two separate, order-
  // dependent passes over the same string.
  function renderInlineCode(text) {
    const matches = [];
    let m;
    CODE_PATTERN.lastIndex = 0;
    while ((m = CODE_PATTERN.exec(text)) !== null) {
      matches.push({ start: m.index, end: m.index + m[0].length, type: 'code', text: m[0] });
    }
    CAPITOLO_REF_PATTERN.lastIndex = 0;
    while ((m = CAPITOLO_REF_PATTERN.exec(text)) !== null) {
      const target = CHAPTER_BY_NUMERO[m[1]];
      if (target) {
        matches.push({ start: m.index, end: m.index + m[0].length, type: 'ref', id: target.id, titolo: target.titolo || '' });
      }
    }
    matches.sort(function(a, b) { return a.start - b.start; });

    let out = '';
    let last = 0;
    matches.forEach(function(mm) {
      if (mm.start < last) return; // matches never overlap by construction; guard anyway
      out += escapeHtml(text.slice(last, mm.start));
      if (mm.type === 'code') {
        out += '<code>' + escapeHtml(mm.text) + '</code>';
      } else {
        out += '<a href="#' + mm.id + '" class="chref">' + escapeHtml(mm.titolo) + '</a>';
      }
      last = mm.end;
    });
    out += escapeHtml(text.slice(last));
    return out;
  }

  function el(tag, opts) {
    const e = document.createElement(tag);
    opts = opts || {};
    if (opts.cls) e.className = opts.cls;
    if (opts.id) e.id = opts.id;
    if (opts.html !== undefined) e.innerHTML = opts.html;
    if (opts.text !== undefined) e.textContent = opts.text;
    return e;
  }

  function renderParagraphs(container, paragrafi) {
    (paragrafi || []).forEach(function(p) {
      container.appendChild(el('p', { html: renderInlineCode(p) }));
    });
  }

  function renderNotes(container, note) {
    (note || []).forEach(function(n) {
      const box = el('div', { cls: 'admonition ' + (n.tipo === 'attenzione' ? 'attenzione' : 'nota') });
      box.appendChild(el('div', { cls: 'adm-label', text: n.tipo === 'attenzione' ? 'Attenzione' : 'Nota' }));
      box.appendChild(el('p', { html: renderInlineCode(n.testo || '') }));
      container.appendChild(box);
    });
  }

  function renderListe(container, liste) {
    (liste || []).forEach(function(l) {
      const tag = l.tipo === 'numerata' ? 'ol' : 'ul';
      const list = el(tag, { cls: 'doc-list' });
      (l.elementi || []).forEach(function(item) {
        list.appendChild(el('li', { html: renderInlineCode(item) }));
      });
      container.appendChild(list);
    });
  }

  function renderCodice(container, codice) {
    (codice || []).forEach(function(c) {
      const block = el('div', { cls: 'code-block' });
      if (c.titolo) block.appendChild(el('div', { cls: 'code-block-title', text: c.titolo }));
      const pre = el('pre', { cls: 'code-block-pre' });
      // textContent, not innerHTML: preserves the \n already in contenuto
      // verbatim (no re-formatting) and escapes anything special in the
      // code itself for free, no separate escaping step needed.
      const code = el('code', {
        cls: 'code-block-code' + (c.linguaggio ? ' language-' + c.linguaggio : ''),
        text: c.contenuto || '',
      });
      pre.appendChild(code);
      block.appendChild(pre);
      container.appendChild(block);
    });
  }

  function renderTables(container, tabelle) {
    (tabelle || []).forEach(function(t) {
      const wrap = el('div', { cls: 'table-wrap' });
      const table = el('table', { cls: 'doc-table' });
      if (t.titolo) {
        const caption = el('caption', { text: t.titolo });
        table.appendChild(caption);
      }
      const thead = el('thead');
      const headRow = el('tr');
      (t.intestazioni || []).forEach(function(h) { headRow.appendChild(el('th', { text: h })); });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = el('tbody');
      (t.righe || []).forEach(function(row) {
        const tr = el('tr');
        row.forEach(function(cell) { tr.appendChild(el('td', { text: cell })); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      container.appendChild(wrap);
    });
  }

  function renderFonti(container, fonti) {
    if (!fonti || !fonti.length) return;
    const box = el('div', { cls: 'bibliography' });
    box.appendChild(el('div', { cls: 'bib-label', text: 'Fonti' }));
    const ol = el('ol', { cls: 'bib-list' });
    fonti.forEach(function(f) {
      const li = el('li');
      if (f.autore) li.appendChild(el('span', { cls: 'bib-autore', text: f.autore + '. ' }));
      if (f.url) {
        const a = el('a', { cls: 'bib-titolo', text: f.titolo || '' });
        a.href = f.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
      } else if (f.titolo) {
        li.appendChild(el('span', { cls: 'bib-titolo', text: f.titolo }));
      }
      if (f.dettagli) li.appendChild(el('span', { cls: 'bib-dettagli', text: ', ' + f.dettagli }));
      if (f.anno) li.appendChild(el('span', { cls: 'bib-anno', text: ' (' + f.anno + ')' }));
      ol.appendChild(li);
    });
    box.appendChild(ol);
    container.appendChild(box);
  }

  let chartCounter = 0;
  function renderCharts(container, grafici) {
    (grafici || []).forEach(function(g) {
      chartCounter++;
      const card = el('div', { cls: 'chart-card' });
      card.appendChild(el('div', { cls: 'chart-title', text: g.titolo || '' }));
      const canvas = el('canvas', { id: 'chart-' + (g.id || chartCounter) });
      card.appendChild(canvas);
      if (g.didascalia) card.appendChild(el('p', { cls: 'chart-caption', html: renderInlineCode(g.didascalia) }));
      if (g.fonte) card.appendChild(el('p', { cls: 'chart-source', text: 'Fonte: ' + g.fonte }));
      container.appendChild(card);

      const datasets = (g.serie || []).map(function(s, i) {
        return {
          label: s.nome,
          data: s.valori,
          backgroundColor: CHART_COLORS[i % CHART_COLORS.length],
          borderRadius: 4,
          maxBarThickness: 56,
        };
      });
      const isLog = g.scala === 'logaritmica';
      try {
      new Chart(canvas, {
        type: g.tipo === 'bar' ? 'bar' : 'bar',
        data: { labels: g.etichette || [], datasets: datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { display: datasets.length > 1, labels: { color: '#565D71', font: { size: 12 } } },
            tooltip: { backgroundColor: '#23293a' },
          },
          scales: {
            x: { ticks: { color: '#565D71', font: { size: 12 } }, grid: { display: false } },
            y: {
              type: isLog ? 'logarithmic' : 'linear',
              ticks: { color: '#565D71', font: { size: 11.5 } },
              grid: { color: '#E1E5EC' },
            },
          },
        },
      });
      } catch (err) {
        // a single bad chart (or, as happened once here, the Chart.js
        // CDN script itself failing to load) must not take the whole
        // page down with it -- Array.forEach doesn't isolate exceptions
        // between iterations, so an uncaught throw here silently dropped
        // every chapter after the first chart in the document.
        console.error('impossibile disegnare il grafico', g.id, err);
        card.appendChild(el('p', { cls: 'chart-caption', text: 'Impossibile disegnare questo grafico.' }));
      }
    });
  }

  function headingTag(depth) {
    if (depth <= 0) return 'h2';
    if (depth === 1) return 'h3';
    return 'h4';
  }

  // Recursively renders a chapter/sottosezione and returns the sidebar
  // <li> tree alongside it, so numbering (4, 4.1, 4.1.1, ...) stays in
  // sync between content and nav without being computed twice.
  function renderNode(node, numero, depth, bodyRoot, navList) {
    const sectionId = node.id;
    const tag = headingTag(depth);
    const section = el('section', { cls: depth === 0 ? 'chapter' : 'subsection', id: sectionId });
    // chapter "0" is front matter (Sommario), not a numbered chapter --
    // shown by title alone, no "Capitolo 0" / "0" badge anywhere.
    const isUnnumbered = depth === 0 && numero === '0';

    if (depth === 0) {
      const crumb = el('div', { cls: 'breadcrumb' });
      crumb.innerHTML = 'Documentazione <span class="sep">&rsaquo;</span> '
        + (isUnnumbered ? escapeHtml(node.titolo || '') : 'Capitolo ' + numero);
      section.appendChild(crumb);
    }
    const heading = el(tag);
    heading.innerHTML = (isUnnumbered ? '' : '<span class="chnum">' + numero + '</span>')
      + escapeHtml(node.titolo || '');
    section.appendChild(heading);

    renderParagraphs(section, node.paragrafi);
    renderNotes(section, node.note);
    renderListe(section, node.liste);
    renderTables(section, node.tabelle);
    renderCharts(section, node.grafici);
    renderCodice(section, node.codice);
    renderFonti(section, node.fonti);

    bodyRoot.appendChild(section);
    if (depth === 0) bodyRoot.appendChild(el('hr', { cls: 'chapter-rule' }));

    // ---- sidebar entry ----
    const li = el('li', { cls: depth === 0 ? 'chapter' : 'sub' });
    const a = el('a', { html: (isUnnumbered ? '' : '<span class="num">' + numero + '</span>')
      + escapeHtml(node.titolo || '') });
    a.href = '#' + sectionId;
    a.dataset.target = sectionId;
    li.appendChild(a);
    navList.appendChild(li);

    const kids = node.sottosezioni || [];
    if (kids.length) {
      const subUl = el('ul', { cls: 'sub-list' });
      kids.forEach(function(child, i) {
        renderNode(child, numero + '.' + (i + 1), depth + 1, bodyRoot, subUl);
      });
      li.appendChild(subUl);
    }
  }

  function setupActiveHighlight() {
    const links = Array.prototype.slice.call(document.querySelectorAll('.sidebar-nav a'));
    if (!links.length || !('IntersectionObserver' in window)) return;
    const byId = {};
    links.forEach(function(a) { byId[a.dataset.target] = a; });
    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        const link = byId[entry.target.id];
        if (!link) return;
        if (entry.isIntersecting) {
          links.forEach(function(a) { a.classList.remove('active'); });
          link.classList.add('active');
        }
      });
    }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
    document.querySelectorAll('section.chapter, section.subsection').forEach(function(s) {
      observer.observe(s);
    });
  }

  function render(data) {
    document.title = (data.meta.titolo_pagina || 'Documentazione') + ' — collateral.mpc';
    document.getElementById('doc-title').textContent = data.meta.titolo_pagina || '';
    document.getElementById('doc-subtitle').textContent = data.meta.sottotitolo_pagina || '';
    document.getElementById('doc-doctype-label').textContent = data.meta.tipo_documento || 'Documentazione';
    document.getElementById('sidebar-doctype').textContent = data.meta.tipo_documento || '';

    buildChapterIndex(data.capitoli);

    const bodyRoot = document.getElementById('doc-body');
    const navRoot = document.getElementById('sidebar-nav');
    bodyRoot.innerHTML = '';
    navRoot.innerHTML = '';
    const navUl = el('ul');
    navRoot.appendChild(navUl);

    (data.capitoli || []).forEach(function(cap) {
      try {
        renderNode(cap, String(cap.numero), 0, bodyRoot, navUl);
      } catch (err) {
        console.error('impossibile renderizzare il capitolo', cap.id, err);
      }
    });

    setupActiveHighlight();
  }

  fetch('/content/documentazione.json')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(render)
    .catch(function(err) {
      console.error('errore caricamento documentazione:', err);
      document.getElementById('load-error').style.display = 'block';
    });

  const toggle = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  toggle.addEventListener('click', function() {
    const open = sidebar.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function(e) {
    if (window.innerWidth > 900) return;
    if (!sidebar.contains(e.target) && e.target !== toggle) sidebar.classList.remove('open');
  });
})();
</script>
</body>
</html>
